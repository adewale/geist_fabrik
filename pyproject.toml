[project]
name = "geistfabrik"
version = "0.10.1"
description = "A Python-based divergence engine for Obsidian vaults"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Ade" }
]
license = "MIT"
keywords = ["obsidian", "knowledge-management", "creativity", "local-first", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # local_files_only is part of the SentenceTransformer constructor from 3.0.
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    # scikit-learn is imported unconditionally (embeddings, vector_search,
    # cluster_labeling, temporal_analysis), so it is a core dependency, not
    # optional. It was previously only in the [stats] extra and happened to be
    # present as a transitive dep of sentence-transformers - a fragile fiction.
    "scikit-learn>=1.3.0",
    # Bounds native BLAS/OpenMP threads around encode() (see embeddings.py)
    "threadpoolctl>=3.0.0",
]

[project.optional-dependencies]
vector-search = [
    "sqlite-vec>=0.1.0",
]
# Genuinely optional: only embedding_metrics imports these, behind HAS_SKDIM /
# HAS_VENDI ImportError guards, for the extended `stats` metrics.
stats = [
    "scikit-dimension>=0.3.0",  # For intrinsic dimensionality
    "vendi-score>=0.0.1",       # For diversity metrics
]

[project.scripts]
geistfabrik = "geistfabrik.cli:main"
gf = "geistfabrik.cli:main"

[project.urls]
Homepage = "https://github.com/adewale/geist_fabrik"
Repository = "https://github.com/adewale/geist_fabrik"
Issues = "https://github.com/adewale/geist_fabrik/issues"
Changelog = "https://github.com/adewale/geist_fabrik/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geistfabrik"]

[tool.hatch.build.targets.wheel.force-include]
"models/all-MiniLM-L6-v2" = "geistfabrik/model_data/all-MiniLM-L6-v2"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/models/all-MiniLM-L6-v2",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (not run by default)",
    "benchmark: Performance benchmark tests (not run by default)",
    "production_model: Uses the real bundled sentence-transformers model",
    "artifact: Builds or inspects release artifacts",
]

[tool.coverage.run]
branch = true
source = ["geistfabrik"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
# The 70% branch gate is applied explicitly after the appended integration
# coverage pass in validation/CI; targeted developer tests remain ungated.
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
required-version = "==0.16.0"
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"examples/geists/code/*.py" = ["E501"]  # Allow long lines in geist suggestion text

[tool.ruff.lint]
# UP (pyupgrade) enforces modern Python 3.11+ syntax, including PEP 585 builtin
# generics (list[x] not List[x]) and PEP 604 unions (X | None not Optional[X]).
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ty.environment]
python-version = "3.11"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "coverage[toml]>=7.7",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.99.0",
    "ruff==0.16.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "types-pyyaml>=6.0",
    "twine>=6.0",
    "ty==0.0.69",
]

[tool.bandit]
# Recurse src only; tests build throwaway SQL/exec by design.
exclude_dirs = ["tests", "benchmarks", "examples", "scripts"]
# B608 (string-built SQL): the only string-formatted SQL in this codebase is
# placeholder lists - ",".join(["?"] * n) - with all values bound as
# parameters (verified). Real injection is prevented by the parameterized-query
# convention; every other bandit check stays on.
skips = ["B608"]
