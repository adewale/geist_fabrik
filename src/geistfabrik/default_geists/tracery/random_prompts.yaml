type: geist-tracery
id: random_prompts
description: Generates random creative prompts using Tracery grammar

tracery:
  origin:
    - "What if you wrote about #topic# from the perspective of #perspective#?"
    - "What if you explored the connection between #concept_pair#?"
    - "What if #action# could reveal something about #topic#?"
    - "What if you reconsidered #topic# through the lens of #lens#?"

  topic:
    - "one of your recent notes"
    - "an old note you haven't visited"
    - "a hub in your knowledge graph"
    - "an orphaned note"

  perspective:
    - "a future version of yourself"
    - "someone who disagrees with you"
    - "a complete beginner"
    - "an expert in the field"

  # Each rule names two different concepts: two independent #concept# draws
  # could pair a concept with itself ("emergence and emergence").
  concept_pair:
    - "emergence and creativity"
    - "emergence and learning"
    - "emergence and change"
    - "emergence and connection"
    - "emergence and complexity"
    - "creativity and learning"
    - "creativity and change"
    - "creativity and connection"
    - "creativity and complexity"
    - "learning and change"
    - "learning and connection"
    - "learning and complexity"
    - "change and connection"
    - "change and complexity"
    - "connection and complexity"

  action:
    - "linking two unrelated notes"
    - "revisiting a stale note"
    - "expanding a stub"
    - "questioning an assumption"

  lens:
    - "systems thinking"
    - "first principles"
    - "historical context"
    - "future implications"

count: 2
