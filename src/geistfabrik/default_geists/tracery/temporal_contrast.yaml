type: geist-tracery
id: temporal_contrast
description: Invites rewriting a past-focused note looking forward
count: 1

tracery:
  origin:
    - "#provocation#"

  # Only the past-note template: a future-focused note (future_tense_ratio
  # > 0.4) almost never exists in real prose, and an empty
  # $vault.future_focused_notes() pool silenced the whole geist, this
  # template included. Pairing past with future notes is temporal_voice's job.
  provocation:
    - "#past_note# is in past tense. What would it say if you rewrote it looking forward?"

  past_note:
    - "$vault.past_focused_notes(1)"
