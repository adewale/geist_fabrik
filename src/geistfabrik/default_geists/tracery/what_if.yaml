type: geist-tracery
id: what_if
description: '"What if" prompts that apply a lens, constraint or transformation to one of your notes'
count: 3

tracery:
  # Absorbs perspective_shifter (metaphor/lens templates), transformation_suggester
  # (descriptor and split templates; the YAML lives on in examples/ as the
  # modifier showcase), random_prompts (recency anchors, "keep one idea") and
  # temporal_contrast ("rewrite an old note as it would read now"). Every
  # template names a note: a noteless prompt is dropped by the filter. The
  # "opposite of #note#" template (contradictor's job) is gone.
  origin:
    - "What if you read #note# as #metaphor.a#?"
    - "What if you approached #note# from #direction#?"
    - "What if #constraint#, #result#?"
    - "What if #note# were #descriptor.a#, not #other_descriptor.a#?"
    - "What if #note# split into #number# #new_form.s#? #question.capitalize#?"
    - "What if you rewrote #recent# for #audience.a#?"
    # old_notes() = least recently modified, so "left alone longest" is true.
    - "#old# is one of the notes you have left alone longest. What if you rewrote it as it would read now?"

  # Pools larger than count: repeats of a note within one session are
  # skipped, so the extra candidates keep `count` filled.
  note:
    - "$vault.sample_notes(9)"

  recent:
    - "$vault.recent_notes(5)"

  old:
    - "$vault.old_notes(5)"

  metaphor:
    - "experiment"
    - "organism"
    - "garden"
    - "conversation"
    - "map"
    - "argument with yourself"

  direction:
    - "the perspective of #viewpoint.a#"
    - "first principles"
    - "ten years in the future"
    - "the point of view of someone who disagrees with it"

  viewpoint:
    - "beginner"
    - "expert"
    - "skeptic"
    - "future version of yourself"

  constraint:
    - "you could keep only one idea from #note#"
    - "you had to explain #note# to #audience.a#"
    - "you had to draw #note#"
    - "you rewrote #note# as #format.a#"

  audience:
    - "child"
    - "expert"
    - "skeptic"

  format:
    - "dialogue"
    - "diagram"
    - "story"

  result:
    - "what would you choose"
    - "what would change"
    - "what would you learn"

  descriptor:
    - "beginning"
    - "origin"
    - "bridge"
    - "question"
    - "opening"

  other_descriptor:
    - "conclusion"
    - "artifact"
    - "answer"
    - "tool"

  number:
    - "three"
    - "five"

  new_form:
    - "question"
    - "experiment"
    - "smaller note"

  question:
    - "what emerges"
    - "which one matters most"
    - "where does each lead"
