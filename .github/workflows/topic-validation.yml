name: Topic validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/geistfabrik/topic*'
      - 'tests/**/test_topic*'
      - 'tests/unit/test_dependency_validation.py'
      - 'tests/fixtures/topic*.json'
      - 'scripts/*topics.py'
      - 'scripts/validate.sh'
      - 'uv.lock'
      - '.github/workflows/topic-validation.yml'

permissions:
  contents: read

jobs:
  quality-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
      UV_LOCKED: '1'
      GEISTFABRIK_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: thebrianbug/LYT-Kit
          ref: e191473fcb326df78cca8a6c49b29420ab318e46
          path: corpora/lyt
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require committed dependencies
        working-directory: project
        run: uv sync --locked --extra vector-search
      - name: Check diagnostic code
        working-directory: project
        run: |
          uv run --frozen ruff check scripts/probe_topic_quality.py scripts/topic_grammar_probe.py
          uv run --frozen ruff format --diff scripts/probe_topic_quality.py scripts/topic_grammar_probe.py
      - name: Diagnose frozen quality failures with real YAKE
        if: always()
        working-directory: project
        run: |
          uv run --frozen --with textblob==0.19.0 python -m scripts.probe_topic_quality \
            --grammar --lyt ../corpora/lyt --output "$RUNNER_TEMP/topic-quality-probes.json"
      - name: Resolve an isolated candidate dependency graph
        if: always()
        working-directory: project
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "topic-candidate-lock"
          target.mkdir()
          for name in ("pyproject.toml", "uv.lock", "README.md"):
              (target / name).write_bytes(Path(name).read_bytes())
          project = target / "pyproject.toml"
          content = project.read_text()
          assert content.count('"yake>=0.7.3,<0.8",') == 1
          project.write_text(content.replace('"yake>=0.7.3,<0.8",', '"yake>=0.7.3,<0.8",\n    "textblob==0.19.0",'))
          PY
          UV_LOCKED=0 uv lock --project "$RUNNER_TEMP/topic-candidate-lock"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          data = (Path(os.environ["RUNNER_TEMP"]) / "topic-candidate-lock/uv.lock").read_bytes()
          print("TOPIC_CANDIDATE_LOCK_BEGIN")
          print(base64.b64encode(data).decode())
          print("TOPIC_CANDIDATE_LOCK_END")
          PY
      - name: Retain source-bound diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: topic-quality-probes
          path: ${{ runner.temp }}/topic-quality-probes.json
          if-no-files-found: ignore
          retention-days: 7

  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
      UV_LOCKED: '1'
      GEISTFABRIK_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the committed dependency graph
        run: uv sync --locked --extra vector-search
      - name: Run repository hooks on changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed_files < <(git diff --name-only "$BASE_REF" HEAD)
          uv run --frozen pre-commit run --files "${changed_files[@]}"
      - name: Focused topic and validation regressions
        if: always()
        run: uv run --frozen pytest tests/unit/test_topic*.py tests/unit/test_dependency_validation.py tests/integration/test_topics.py --no-cov -q
      - name: Frozen topic quality gates
        if: always()
        run: uv run --frozen python scripts/evaluate_topics.py
      - name: Positive-query indexing benchmark
        if: always()
        run: uv run --frozen python scripts/benchmark_topics.py
      - name: Reject and expose uncommitted hook repairs
        if: always()
        run: |
          echo TOPIC_VALIDATION_PATCH_BEGIN
          git diff --binary | base64 -w 76
          echo TOPIC_VALIDATION_PATCH_END
          git diff --exit-code

  canonical:
    needs: topics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: '3.12'
      PACKAGE_SMOKE_PYTHON: '3.12'
      GEISTFABRIK_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Required canonical validation
        run: ./scripts/validate.sh
