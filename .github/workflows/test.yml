name: Test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      GEISTFABRIK_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra vector-search

      - name: Verify matrix interpreter
        run: >-
          uv run python -c "import os, sys;
          expected = tuple(map(int, os.environ['UV_PYTHON'].split('.')));
          print(sys.version); assert sys.version_info[:2] == expected"

      - name: Run unit tests
        run: >-
          uv run pytest tests/unit -v
          -m "not slow and not benchmark and not artifact and not production_model"
          --timeout=60 --require-geist-firing --cov=geistfabrik --cov-branch --cov-report=

      - name: Run integration tests and enforce branch coverage
        run: >-
          uv run pytest tests/integration -v
          -m "not slow and not benchmark and not artifact and not production_model"
          --timeout=300 --cov=geistfabrik --cov-branch --cov-append
          --cov-report=term-missing

      - name: Enforce branch-only coverage
        run: uv run python scripts/check_branch_coverage.py --minimum 70

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run mypy type checking
        run: uv run mypy src/ --strict

      - name: Run ty type checking
        run: uv run ty check src tests --error-on-warning

      - name: Check for unused database tables
        run: uv run python scripts/detect_unused_tables.py

      - name: Security scan (bandit)
        run: uv run bandit -c pyproject.toml -r src/geistfabrik -ll -q

      - name: Acceptance criteria
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python scripts/check_phase_completion.py

      # Pinned actionlint, built from source through the checksum-verified Go
      # module proxy; it runs shellcheck on `run:` scripts when available.
      # Release-path behaviour is covered by tests/unit/test_release_workflow_contract.py.
      - name: Lint workflows (actionlint)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  package-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Require materialized Git LFS model
        run: |
          git lfs pull
          test "$(wc -c < models/all-MiniLM-L6-v2/model.safetensors)" -gt 1000
          ! head -c 64 models/all-MiniLM-L6-v2/model.safetensors | grep -q 'git-lfs.github.com'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra vector-search

      - name: Verify matrix interpreter
        run: >-
          uv run python -c "import os, sys;
          expected = tuple(map(int, os.environ['UV_PYTHON'].split('.')));
          print(sys.version); assert sys.version_info[:2] == expected"

      - name: Build and smoke-test installed artifacts offline
        env:
          PACKAGE_SMOKE_WORKDIR: ${{ github.workspace }}/package-smoke-work
          PACKAGE_SMOKE_PYTHON: ${{ matrix.python-version }}
        run: |
          set -o pipefail
          ./scripts/test_wheel.sh 2>&1 | tee package-smoke.log

      - name: Upload package-smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-${{ matrix.python-version }}-diagnostics
          path: |
            package-smoke-work/**
            package-smoke.log
          retention-days: 3

      - name: Stage canonical release artifacts
        if: >-
          success() && matrix.python-version == '3.11' &&
          startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-dist
          cp package-smoke-work/run.*/dist/geistfabrik-*.whl release-dist/
          cp package-smoke-work/run.*/dist/geistfabrik-*.tar.gz release-dist/

      - name: Retain canonical tested release artifacts
        if: >-
          success() && matrix.python-version == '3.11' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the canonical tested artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Verify tag, package, and artifact versions agree
        run: python scripts/check_release_version.py "$GITHUB_REF_NAME" --artifact-dir dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum geistfabrik-*.whl geistfabrik-*.tar.gz > SHA256SUMS

      - name: Publish the tested bytes to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --generate-notes --title "GeistFabrik $GITHUB_REF_NAME"
